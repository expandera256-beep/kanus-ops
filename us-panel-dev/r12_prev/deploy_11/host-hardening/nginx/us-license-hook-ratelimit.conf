# DRAFT — apply to /etc/nginx/conf.d/us-license-hook-ratelimit.conf (http context via conf.d).
# Diff vs LIVE (2026-11-06): LIVE used per-IP zones for webhooks (10r/s) and credits (5r/s).
# This draft: webhooks use a SHARED key ($server_name) so Shopify's many egress IPs share one
# generous bucket; /v1 stays per-IP; account auth gets a strict per-IP zone.

# Global webhook budget for this vhost (not per Shopify edge IP).
limit_req_zone $server_name zone=uslic_webhooks_global:10m rate=40r/s;

# Per-client API / model / credits.
limit_req_zone $binary_remote_addr zone=uslic_v1:10m rate=10r/s;

# Strict auth endpoints (login/register/password-reset/verify).
limit_req_zone $binary_remote_addr zone=uslic_account_auth:10m rate=1r/s;

limit_req_status 429;
