# DRAFT — /etc/nginx/snippets/us-license-hook-locations.conf
# Diff vs LIVE: account/ no longer 404 — proxy to Go :8787; webhook limit uses global zone;
# /v1 uses uslic_v1; login/register get uslic_account_auth; SSE paths keep buffering off + 2700s
# (LIVE already has this for /v1/chat, /v1/chat/completions, /v1/models, /v1/credits/status).
# Binary/README account routes present: register, login, balance, redeem, requests, workers,
# verify-email, verification/request, password-reset/request, password-reset/confirm.
# LIVE currently returns 404 for /account/ — enabling this is a behaviour change (intentional).

# --- Shopify webhooks (global rate; preserve raw body/headers) ---
location = /webhooks/shopify/orders-paid {
    limit_req zone=uslic_webhooks_global burst=80 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}
location = /webhooks/shopify/orders-cancelled {
    limit_req zone=uslic_webhooks_global burst=80 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}
location = /webhooks/shopify/refunds-create {
    limit_req zone=uslic_webhooks_global burst=80 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}

# --- Credits / models (per-IP) ---
location = /v1/credits/reserve {
    limit_req zone=uslic_v1 burst=20 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}
location = /v1/credits/settle {
    limit_req zone=uslic_v1 burst=20 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}
location = /v1/credits/status {
    limit_req zone=uslic_v1 burst=20 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
}
location = /v1/models {
    limit_req zone=uslic_v1 burst=20 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
}

# --- Model chat SSE (preserve LIVE buffering/timeouts) ---
location = /v1/chat {
    limit_req zone=uslic_v1 burst=10 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
    send_timeout 2700s;
}
location = /v1/chat/completions {
    limit_req zone=uslic_v1 burst=10 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
    send_timeout 2700s;
}

location = /healthz {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_read_timeout 30s;
}

# --- Accounts: strict auth endpoints ---
location = /account/login {
    limit_req zone=uslic_account_auth burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
}
location = /account/register {
    limit_req zone=uslic_account_auth burst=3 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
}
location = /account/password-reset/request {
    limit_req zone=uslic_account_auth burst=3 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location = /account/password-reset/confirm {
    limit_req zone=uslic_account_auth burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location = /account/verification/request {
    limit_req zone=uslic_account_auth burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
location = /account/verify-email {
    limit_req zone=uslic_account_auth burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Remaining /account/* (balance, redeem, requests, workers, …)
location ^~ /account/ {
    limit_req zone=uslic_v1 burst=20 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
}

location = /webhooks/shopify { return 404; }
location /webhooks/shopify/ { return 404; }
location /internal/ { return 404; }
