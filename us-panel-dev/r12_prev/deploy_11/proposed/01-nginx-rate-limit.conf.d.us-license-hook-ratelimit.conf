# UYGULANMADI — taslak.
# Kurulum: /etc/nginx/conf.d/us-license-hook-ratelimit.conf olarak kopyala.
# Not: limit_req_zone http{} bağlamında olmalı; conf.d Ubuntu nginx'te http içinde include edilir.
# Sonra api-test location'larına limit_req ekle (02-*.snippet.patch) ve: nginx -t && systemctl reload nginx
# Restart gerekmez; reload yeterli. Geri alma: conf.d dosyasını ve location satırlarını sil → nginx -t → reload.

limit_req_zone $binary_remote_addr zone=uslic_webhooks:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=uslic_credits:10m rate=5r/s;
limit_req_status 429;
