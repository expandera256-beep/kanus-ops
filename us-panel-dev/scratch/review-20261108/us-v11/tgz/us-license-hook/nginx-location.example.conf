# Include inside existing api-test.kanus.org HTTPS server; preserve existing TLS/site settings.
# Preserve raw webhook body and headers; never log Authorization or license values.
location = /webhooks/shopify/orders-paid {
 client_max_body_size 1m;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /webhooks/shopify/orders-cancelled {
 client_max_body_size 1m;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /webhooks/shopify/refunds-create {
 client_max_body_size 1m;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /v1/credits/reserve {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /v1/credits/settle {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /v1/credits/status {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /healthz {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /v1/models {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 30s;
}
location = /v1/chat {
 client_max_body_size 1m;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 3100s;
 proxy_http_version 1.1;
 proxy_buffering off;
 proxy_request_buffering on;
 proxy_ignore_client_abort off;
 proxy_send_timeout 3100s;
 send_timeout 3100s;
}
location = /v1/chat/completions {
 client_max_body_size 1m;
 proxy_pass http://127.0.0.1:8787;
 proxy_read_timeout 3100s;
 proxy_http_version 1.1;
 proxy_buffering off;
 proxy_request_buffering on;
 proxy_ignore_client_abort off;
 proxy_send_timeout 3100s;
 send_timeout 3100s;
}
location = /webhooks/shopify { return 404; }
location /webhooks/shopify/ { return 404; }
# New accounts API stays on Go. Overwrite, never trust incoming X-Real-IP.
location ^~ /account/ {
 client_max_body_size 16k;
 proxy_pass http://127.0.0.1:8787;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header Authorization $http_authorization;
 proxy_read_timeout 30s;
}
location /internal/ { return 404; }
