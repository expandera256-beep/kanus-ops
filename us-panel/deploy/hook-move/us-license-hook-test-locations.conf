# api-test.kanus.org on prod — proxy to test instance :8788
location = /webhooks/shopify/orders-paid {
    limit_req zone=uslic_test_webhooks burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /webhooks/shopify/orders-cancelled {
    limit_req zone=uslic_test_webhooks burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /webhooks/shopify/refunds-create {
    limit_req zone=uslic_test_webhooks burst=20 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /v1/credits/reserve {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /v1/credits/settle {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /v1/credits/status {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
}
location = /healthz {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_read_timeout 30s;
}
location = /v1/models {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
}
location = /v1/chat {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
    send_timeout 2700s;
}
location = /v1/chat/completions {
    limit_req zone=uslic_test_credits burst=10 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering on;
    proxy_ignore_client_abort off;
    proxy_read_timeout 2700s;
    proxy_send_timeout 2700s;
    send_timeout 2700s;
}
location = /webhooks/shopify { return 404; }
location /webhooks/shopify/ { return 404; }
location = /account/login {
    limit_req zone=uslic_test_account burst=2 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
location = /account/register {
    limit_req zone=uslic_test_account burst=2 nodelay;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
location ^~ /account/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
location /internal/ { return 404; }
